<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ student.first_name }} {{ student.last_name }}</title>
</head>
<body>
    <a href="{% url 'student_list' %}">← Retour à la liste</a>
    <h1>{{ student.first_name }} {{ student.last_name }}</h1>
    <p>Numéro : {{ student.id }}</p>
    <p>Classe : {{ student.classe }}</p>
    <p>Téléphone : {{ student.phone|default:"Non renseigné" }}</p>
</body>
</html>
