{% extends "base.html" %}

{% block title %}Enseignants{% endblock %}

{% block content %}
<h1>Enseignants</h1>
<table>
    <tr>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Matière</th>
    </tr>
    {% for teacher in teachers %}
    <tr>
        <td>{{ teacher.first_name }}</td>
        <td>{{ teacher.last_name }}</td>
        <td>{{ teacher.subject }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
